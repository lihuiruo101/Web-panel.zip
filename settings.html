<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>설정 | Tf Store</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0f1117;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 200px;
      background: linear-gradient(145deg, #1a73e8, #4fc3f7);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .menu a {
      color: #e0f0ff;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .menu a:hover {
      background-color: rgba(255,255,255,0.1);
    }

    .menu a.active {
      background-color: rgba(255,255,255,0.2);
      font-weight: 800;
      color: #fff;
    }

    .logout-btn {
      margin-top: 20px;
      background: #ff4444;
      text-align: center;
      color: white;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
    }

    .logout-btn:hover {
      background-color: #e93333;
    }

    .main-content {
      flex-grow: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #4fc3f7;
    }

    .setting-group {
      background-color: #1c1f26;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 0 12px rgba(79, 195, 247, 0.2);
    }

    .setting-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ccc;
    }

    .setting-group input, .setting-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      background-color: #2a2e38;
      color: white;
    }

    .save-btn {
      background-color: #0f9d58;
      color: white;
      padding: 10px 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .save-btn:hover {
      background-color: #0b7d43;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">Tf Store</div>
    <nav class="menu">
      <a href="dashboard.html">대시보드</a>
      <a href="buy.html">구매 하기</a>
      <a href="store.html">구매 로그</a>
      <a href="settings.html" class="active">설정</a>
      <a href="users.html">사용자 관리</a>
      <a href="grades.html">등급 관리</a>
      <a href="coupon.html">쿠폰 관리</a>
      <a href="notice.html">공지사항</a>
      <a href="recharge.html">충전 페이지</a>
      <a href="auto-recharge.html">자동 충전</a>
      <a href="webhook.html">디스코드 웹훅 설정</a>
      <a href="invite.html">초대 링크 관리</a>
      <a href="login.html" class="logout-btn">로그아웃</a>
    </nav>
  </div>

  <div class="main-content">
    <h1>설정</h1>

    <div class="setting-group">
      <label for="nickname">닉네임 변경</label>
      <input type="text" id="nickname" placeholder="새 닉네임  입력" />

      <label for="password">비밀번호 변경</label>
      <input type="password" id="password" placeholder="새 비밀번호 입력" />

      <label for="notifications">알림 설정</label>
      <select id="notifications">
        <option value="all">모든 알림 받기</option>
        <option value="important">중요한 알림만</option>
        <option value="none">알림 끄기</option>
      </select>

      <button class="save-btn" onclick="saveSettings()">저장하 기</button>
    </div>
  </div>

  <script>
    function saveSettings() {
      const nickname = document.getElementById("nickname").value.trim();
      const password = document.getElementById("password").value;
      const notifications = document.getElementById("notifications").value;

      // 여기서 실제 저장 로직 연결 가능 (예: API 연동)
      alert("설정이 저장되었습니다.");
      console.log("닉네임:", nickname);
      console.log("비밀번호:", password ? "변경됨" : "변경 없음");
      console.log("알림 설정:", notifications);
    }
  </script>
</body>
</html>
