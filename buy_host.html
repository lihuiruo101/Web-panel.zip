<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공용 채팅방</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #121212;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1a73e8;
      padding: 15px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .message {
      margin-bottom: 10px;
      padding: 10px;
      background: #1e1e1e;
      border-radius: 8px;
      max-width: 70%;
    }
    .mention-highlight {
      background-color: #2e3b8f;
      color: #fff;
    }
    .input-box {
      display: flex;
      padding: 15px;
      border-top: 1px solid #333;
      background-color: #1a1a1a;
    }
    #message-input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #2c2c2c;
      color: white;
    }
    #send-btn {
      margin-left: 10px;
      padding: 10px 16px;
      background-color: #0f9d58;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .mention-list {
      position: absolute;
      bottom: 65px;
      left: 15px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      z-index: 1000;
      display: none;
      flex-direction: column;
      width: 200px;
    }
    .mention-item {
      padding: 8px 12px;
      cursor: pointer;
      color: #ccc;
    }
    .mention-item:hover {
      background-color: #3a3a3a;
      color: white;
    }
  </style>
</head>
<body>
  <header>💬 공용 채팅방</header>

  <div class="chat-box" id="chat-box"></div>
  <div class="mention-list" id="mention-list"></div>

  <div class="input-box">
    <input type="text" id="message-input" placeholder="메시지를 입력하세요" autocomplete="off" />
    <button id="send-btn">전송</button>
  </div>

  <script>
    const currentUser = localStorage.getItem('currentUser');
    if (!currentUser) {
      alert('로그인이 필요합니다.');
      location.href = 'login.html';
    }

    // 사용자 목록 등록
    let activeUsers = JSON.parse(localStorage.getItem('activeUsers')) || [];
    if (!activeUsers.includes(currentUser)) {
      activeUsers.push(currentUser);
      localStorage.setItem('activeUsers', JSON.stringify(activeUsers));
    }

    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const mentionList = document.getElementById('mention-list');

    // 채팅 로그 불러오기
    const chatLogs = JSON.parse(localStorage.getItem('chatLogs')) || [];

    // 메시지 렌더링
    function renderMessage({ user, text }) {
      const div = document.createElement('div');
      div.className = 'message';

      if (/@(\w+)/.test(text)) {
        const match = text.match(/@(\w+)/);
        if (activeUsers.includes(match[1])) {
          div.classList.add('mention-highlight');
        }
      }

      div.textContent = `${user}: ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 이전 메시지 표시
    chatLogs.forEach(msg => renderMessage(msg));

    // 전송 버튼 이벤트
    sendBtn.addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (!text) return;

      const message = { user: currentUser, text };
      chatLogs.push(message);
      localStorage.setItem('chatLogs', JSON.stringify(chatLogs));

      renderMessage(message);
      messageInput.value = '';
      mentionList.style.display = 'none';
    });

    // 멘션 감지
    messageInput.addEventListener('input', () => {
      const val = messageInput.value;
      const cursor = messageInput.selectionStart;
      const before = val.slice(0, cursor);

      if (before.endsWith('@')) {
        mentionList.innerHTML = '';
        activeUsers.forEach(user => {
          const item = document.createElement('div');
          item.className = 'mention-item';
          item.textContent = user;
          item.onclick = () => {
            messageInput.value = val.slice(0, cursor) + user + ' ' + val.slice(cursor);
            mentionList.style.display = 'none';
            messageInput.focus();
          };
          mentionList.appendChild(item);
        });
        mentionList.style.display = 'flex';
      } else {
        mentionList.style.display = 'none';
      }
    });

    // 외부 클릭 시 멘션 목록 숨김
    document.addEventListener('click', e => {
      if (!mentionList.contains(e.target) && e.target !== messageInput) {
        mentionList.style.display = 'none';
      }
    });
  </script>
</body>
</html>
