<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사용자 관리 | Tf Store</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0; padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0f1117;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 220px;
      background: linear-gradient(145deg, #1a73e8, #4fc3f7);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 50px;
      color: white;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      letter-spacing: 2px;
    }

    .menu a {
      color: #e0f0ff;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: block;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 0 5px rgba(255,255,255,0.05);
    }

    .menu a:hover {
      background-color: rgba(255,255,255,0.15);
      box-shadow: 0 0 15px rgba(79, 195, 247, 0.8);
    }

    .menu a.active {
      background-color: rgba(255,255,255,0.3);
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 20px #4fc3f7;
      pointer-events: none;
      cursor: default;
    }

    .logout-btn {
      margin-top: auto;
      background: #ff4444;
      text-align: center;
      color: white;
      font-weight: 700;
      padding: 12px 0;
      border-radius: 10px;
      box-shadow: 0 0 10px #ff4444cc;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .logout-btn:hover {
      background-color: #e93333;
      box-shadow: 0 0 18px #ff2a2a;
    }

    .main-content {
      flex-grow: 1;
      padding: 40px 50px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #121416, #1c1f26);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      color: #4fc3f7;
      text-shadow: 0 0 15px #4fc3f7cc;
      user-select: none;
    }

    .user-list {
      background-color: #23272e;
      border-radius: 16px;
      padding: 25px 30px;
      box-shadow: 0 0 25px rgba(79, 195, 247, 0.3);
      max-width: 700px;
      margin: 0 auto;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #2e3440;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #d0e8ff;
      transition: background-color 0.15s ease;
      border-radius: 8px;
      user-select: none;
    }

    .user-item:last-child {
      border-bottom: none;
    }

    .user-item:hover {
      background-color: rgba(79,195,247,0.1);
    }

    .user-actions button {
      background-color: #ff5555;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 10px #ff5555aa;
      transition: background-color 0.3s ease;
      user-select: none;
    }

    .user-actions button:hover {
      background-color: #e93333;
      box-shadow: 0 0 15px #ff2222cc;
    }

    .no-users {
      color: #888;
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
      padding: 100px 0;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">Tf Store</div>
    <nav class="menu">
      <a href="dashboard.html">대시보드</a>
      <a href="buy.html">구매 하기</a>
      <a href="store.html">구매 로그</a>
      <a href="settings.html">설정</a>
      <a href="users.html" class="active">사용자 관리</a>
      <a href="grades.html">등급 관리</a>
      <a href="coupon.html">쿠폰 관리</a>
      <a href="notice.html">공지사항</a>
      <a href="recharge.html">충전 페이지</a>
      <a href="auto-recharge.html">자동 충전</a>
      <a href="webhook.html">디스코드 웹훅 설정</a>
      <a href="invite.html">초대 링크 관리</a>
      <a href="login.html" class="logout-btn">로그아웃</a>
    </nav>
  </div>

  <div class="main-content">
    <h1>사용자 관리</h1>
    <div class="user-list" id="user-list">
      <!-- 사용자 목록 렌더링 -->
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("currentUser");

    if (currentUser !== "lihuiruo1") {
      alert("접근 권한이 없습니다.");
      window.location.href = "dashboard.html";
    }

    function loadUsers() {
      return JSON.parse(localStorage.getItem("users")) || [];
    }

    function saveUsers(users) {
      localStorage.setItem("users", JSON.stringify(users));
    }

    function renderUsers() {
      const listEl = document.getElementById("user-list");
      listEl.innerHTML = "";

      const users = loadUsers();

      if (users.length === 0) {
        const noUserMsg = document.createElement("div");
        noUserMsg.className = "no-users";
        noUserMsg.textContent = "등록된 사용자가 없습니다.";
        listEl.appendChild(noUserMsg);
        return;
      }

      users.forEach((user, index) => {
        const item = document.createElement("div");
        item.className = "user-item";

        const name = document.createElement("div");
        name.textContent = user.username;

        const actions = document.createElement("div");
        actions.className = "user-actions";

        if (user.username !== "lihuiruo1") {
          const delBtn = document.createElement("button");
          delBtn.textContent = "삭제";
          delBtn.onclick = () => {
            if (confirm(`${user.username}을(를) 삭제하시겠습니 까?`)) {
              users.splice(index, 1);
              saveUsers(users);
              renderUsers();
            }
          };
          actions.appendChild(delBtn);
        } else {
          actions.textContent = "관리자";
          actions.style.color = "#4fc3f7";
          actions.style.fontWeight = "700";
        }

        item.appendChild(name);
        item.appendChild(actions);
        listEl.appendChild(item);
      });
    }

    renderUsers();
  </script>
</body>
</html>
