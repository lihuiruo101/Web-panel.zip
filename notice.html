<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 | TF 스토어</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0f1117;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 220px;
      background: linear-gradient(145deg, #1a73e8, #4fc3f7);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 40px;
      color: white;
      text-shadow: 0 0 8px rgba(255,255,255,0.3);
    }

    .menu a {
      color: #e0f0ff;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .menu a:hover {
      background-color: rgba(255,255,255,0.15);
    }

    .menu a.active {
      background-color: rgba(255,255,255,0.25);
      font-weight: 800;
      color: #fff;
    }

    .main-content {
      flex-grow: 1;
      padding: 40px;
      overflow-y: auto;
      background: linear-gradient(135deg, #121416, #1c1f26);
    }

    h1 {
      font-size: 2.2rem;
      color: #4fc3f7;
      text-shadow: 0 0 10px #4fc3f7aa;
      margin-bottom: 30px;
    }

    .notice-box {
      background-color: #1c1f26;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(79, 195, 247, 0.3);
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 300px;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      height: 300px;
      background-color: #1a1d23;
      color: #f0f0f0;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 1rem;
      font-family: 'Noto Sans KR', sans-serif;
      resize: vertical;
      box-shadow: inset 0 0 10px #4fc3f7aa;
    }

    button {
      margin-top: 20px;
      background-color: #1a73e8;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 15px #4fc3f7aa;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #1565c0;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">TF 스토어</div>
    <nav class="menu">
      <a href="dashboard.html">대시보드</a>
      <a href="buy.html">구매 하기</a>
      <a href="store.html">구매 로그</a>
      <a href="settings.html">설정</a>
      <a href="users.html">사용자 관리</a>
      <a href="grades.html">등급 관리</a>
      <a href="coupon.html">쿠폰 관리</a>
      <a href="notice.html" class="active">공지사항</a>
      <a href="recharge.html">충전 페이지</a>
      <a href="auto-recharge.html">자동 충전</a>
      <a href="webhook.html">디스코드 웹훅 설정</a>
      <a href="invite.html">초대 링크 관리</a>
      <a href="login.html" class="logout-btn">로그아웃</a>
    </nav>
  </div>

  <div class="main-content">
    <h1>공지사항</h1>

    <div class="notice-box" id="notice-box"></div>

    <textarea id="notice-input" placeholder="공지사항 내용을 입력하세요. 마크다운 형식 지원"></textarea>
    <button id="save-btn">저장</button>
  </div>

  <script>
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser !== 'lihuiruo1') {
      alert('접근 권한이 없습니다.');
      location.href = 'dashboard.html';
    }

    const noticeBox = document.getElementById('notice-box');
    const noticeInput = document.getElementById('notice-input');
    const saveBtn = document.getElementById('save-btn');

    function loadNotice() {
      const saved = localStorage.getItem('noticeContent');
      if (saved) {
        noticeBox.innerHTML = marked.parse(saved);
        noticeInput.value = saved;
      } else {
        noticeBox.textContent = '저장된 공지사항이 없습니다.';
      }
    }

    saveBtn.addEventListener('click', () => {
      const content = noticeInput.value.trim();
      if (!content) {
        alert('공지사항 내용을 입력해주세요.');
        return;
      }
      localStorage.setItem('noticeContent', content);
      noticeBox.innerHTML = marked.parse(content);
      alert('공지사항이 저장되었습니다.');
    });

    loadNotice();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
