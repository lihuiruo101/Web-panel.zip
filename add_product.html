<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />                                                        <title>상품 추가 | Tf store</title>
<style>
  body {
    margin: 0; padding: 0;
    font-family: 'Noto Sans KR', sans-serif;
    background-color: #121212;
    color: #eee;
  }
  .container {
    max-width: 480px;
    margin: 60px auto;
    background: #222;
    border-radius: 12px;
    padding: 25px 30px;
    box-shadow: 0 0 20px rgba(79,195,247,0.5);
  }
  h1 {
    margin-bottom: 20px;
    color: #4fc3f7;
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 10px #4fc3f7aa;
  }
  label {
    display: block;
    margin: 15px 0 6px;
    font-weight: 700;
  }
  input[type="text"],
  textarea,
  input[type="number"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    box-sizing: border-box;
    background-color: #1a1a1a;
    color: #eee;
  }
  textarea {
    resize: vertical;
    min-height: 80px;
  }
  button {
    margin-top: 25px;
    width: 100%;
    padding: 14px 0;
    background-color: #0f9d58;
    border: none;
    border-radius: 12px;
    font-size: 1.15rem;
    font-weight: 900;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #0b7d43;
  }
  .cancel-btn {
    background-color: #e53935;
    margin-top: 10px;
  }
  .cancel-btn:hover {
    background-color: #b71c1c;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>상품 추가</h1>
    <form id="product-form">
      <label for="name">상품명</label>
      <input type="text" id="name" name="name" required placeholder="예: 작은 별" />

      <label for="image">이미지 URL</label>
      <input type="text" id="image" name="image" placeholder=" 예: https://example.com/image.jpg" />

      <label for="description">상품 설명</label>
      <textarea id="description" name="description" placeholder="상품에 대한 설명을 입력하세요"></textarea>

      <label for="price">가격 (숫자만)</label>
      <input type="number" id="price" name="price" min="0" required placeholder="예: 12000" />

      <button type="submit">상품 추가하기</button>
      <button type="button" class="cancel-btn" id="cancel-btn">취소</button>
    </form>
  </div>

<script>
  // 로그인 확인 (lihuiruo1 아니면 뒤로가기)
  const currentUser = localStorage.getItem('currentUser') || '';
  if (currentUser !== 'lihuiruo1') {
    alert('접근 권한이 없습니다.');
    window.location.href = 'buy.html';
  }

  const form = document.getElementById('product-form');
  const cancelBtn = document.getElementById('cancel-btn');

  form.addEventListener('submit', e => {
    e.preventDefault();

    const name = form.name.value.trim();
    const image = form.image.value.trim();
    const description = form.description.value.trim();
    const price = form.price.value.trim();

    if (!name || !price || isNaN(price) || price < 0) {
      alert('상품명과 가격은 올바르게 입력해주세요.');
      return;
    }

    // 기존 상품 불러오기
    let products = JSON.parse(localStorage.getItem('products')) || [];

    // 새 상품 객체 생성
    const newProduct = {
      name,
      image: image || '',
      description,
      price: Number(price)
    };

    // 새 상품 배열 앞에 추가 (최신순 유지)
    products.unshift(newProduct);

    // 로컬스토리지 저장
    localStorage.setItem('products', JSON.stringify(products));

    alert('상품이 성공적으로 추가되었습니다.');
    window.location.href = 'buy.html';
  });

  cancelBtn.addEventListener('click', () => {
    window.location.href = 'buy.html';
  });
</script>
</body>
</html>
